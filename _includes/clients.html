<!-- Software -->
<section class="page-section" id="{{ site.data.sitetext.clients.section | default: "clients" }}" style="padding-bottom:65px">
  <div class="container">
    <div class="row" {% if site.data.sitetext.clients.horizontal-scrolling == "yes" %} id="scrolling-clients" {% endif %}>
	  {% for client in site.data.sitetext.clients.list %}
      <div class="col-md-12">
          <img class="img-fluid d-block mx-auto" src="{{ client.logo }}" alt="{{ client.title }}" style="max-height: 100px">
      </div>
	  {% endfor %}
    </div>
  </div>
</section>
<!-- End of Software -->
